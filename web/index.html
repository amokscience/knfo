<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kubernetes Namespaces</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #0f172a;
      color: #e2e8f0;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 10px;
      padding: 20px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 1.5rem;
    }

    .controls {
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    button {
      background: #2563eb;
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .error {
      color: #fecaca;
      background: #7f1d1d;
      border: 1px solid #991b1b;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #1e293b;
    }

    th {
      background: #1f2937;
      font-weight: 600;
    }

    tr:nth-child(odd) {
      background: #0b1220;
    }

    .muted {
      color: #94a3b8;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="/app.jsx"></script>
</body>
</html>
