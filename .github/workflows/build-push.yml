name: Build and Push Docker Image

on:
  push:
    branches: [ dev, qa, staging, prod ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate short SHA
        id: short_sha
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/knfo:${{ github.ref_name }}-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/knfo:${{ github.ref_name }}-${{ steps.short_sha.outputs.sha }}

      - name: Update GitOps repo with new image tag
        continue-on-error: true
        run: |
          git clone https://github.com/amokscience/argo-apps.git
          cd argo-apps

          SHORT_SHA=${{ github.sha }}
          SHORT_SHA=${SHORT_SHA:0:7}

          case "${{ github.ref_name }}" in
            dev)
              VALUES_FILE="knfo/helm/values-dev.yaml"
              TAG_PREFIX="dev"
              ;;
            qa)
              VALUES_FILE="knfo/helm/values-qa.yaml"
              TAG_PREFIX="qa"
              ;;
            staging)
              VALUES_FILE="knfo/helm/values-staging.yaml"
              TAG_PREFIX="staging"
              ;;
            prod)
              VALUES_FILE="knfo/helm/values-prod.yaml"
              TAG_PREFIX="prod"
              ;;
          esac

          sed -i "s/tag: \"${TAG_PREFIX}-.*/tag: \"${TAG_PREFIX}-${SHORT_SHA}\"/" $VALUES_FILE

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.email "bot@example.com"
          git config user.name "GitHub Actions Bot"
          git add $VALUES_FILE
          git commit -m "Update ${TAG_PREFIX} image tag to ${TAG_PREFIX}-${SHORT_SHA}"
          git remote set-url origin https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/amokscience/argo-apps.git
          git push origin HEAD:main

  promote:
    needs: build
    runs-on: ubuntu-latest
    if: |
      success() &&
      (github.ref == 'refs/heads/dev' ||
       github.ref == 'refs/heads/qa' ||
       github.ref == 'refs/heads/staging')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Must use a PAT here — GITHUB_TOKEN pushes do NOT trigger new workflow runs,
          # which would break the dev→qa→staging→prod cascade.
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

      - name: Promote dev to qa
        if: github.ref == 'refs/heads/dev'
        run: |
          git fetch origin
          git checkout -B qa origin/qa
          git merge origin/dev --no-ff -m "Auto-promote from dev after successful build"
          git push origin qa

      - name: Promote qa to staging
        if: github.ref == 'refs/heads/qa'
        run: |
          git fetch origin
          git checkout -B staging origin/staging
          git merge origin/qa --no-ff -m "Auto-promote from qa after successful build"
          git push origin staging

      - name: Promote staging to prod
        if: github.ref == 'refs/heads/staging'
        run: |
          git fetch origin
          git checkout -B prod origin/prod
          git merge origin/staging --no-ff -m "Auto-promote from staging after successful build"
          git push origin prod
